# .github/workflows/ci-cd.yml
name: CI/CD - Build, Push & Deploy

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.IMAGE_NAME }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.IMAGE_NAME }}:latest

      - name: Set image tag output
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_OUTPUT

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.30.0' # specify preferred version

      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update k8s image and apply manifests
        env:
          IMAGE: ${{ secrets.IMAGE_NAME }}:${{ github.sha }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          # Create TLS secret step intentionally omitted: instruct secret creation manually or via separate step
          # Patch deployment image
          kubectl apply -f k8s/service.yaml -n wisecow
          # Replace image in the deployment YAML locally then apply
          sed -i "s|image: .*|image: $IMAGE|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml -n wisecow
          kubectl apply -f k8s/ingress.yaml -n wisecow
